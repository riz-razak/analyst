<!doctype html><meta charset="utf-8">
<title>A/L thumbnail — Sinhala (1200×630, screenshot .card to PNG)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Sinhala can't be rasterised server-side (no Sinhala font in the build env),
     so this is a pixel-exact 1200×630 card. Open in a browser, screenshot the
     .card element, save as assets/thumbnail-si.png. Photo already sits beside it. */
  :root{ --paper:#FAFAF8; --ink:#1A1A2E; --forest:#2D6A4F; --gold:#C4A35A; --muted:#5C5C6B; --line:#E5E1DA; }
  html,body{margin:0;background:#333;display:grid;place-items:center;min-height:100vh}
  .card{width:1200px;height:630px;background:var(--paper);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 470px}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:var(--forest);z-index:3}
  .text{padding:56px 40px 40px 64px;position:relative;z-index:2}
  .kicker{font:800 19px/1 'DM Mono',monospace;letter-spacing:.05em;color:var(--forest);text-transform:uppercase}
  h1{font:800 60px/1.2 'Noto Sans Sinhala',sans-serif;color:var(--ink);margin:18px 0 0}
  .u{display:inline-block;border-bottom:8px solid var(--gold);padding-bottom:2px}
  .dek{font:400 24px/1.9 'Noto Sans Sinhala',sans-serif;color:var(--muted);margin:24px 0 0}
  .photo{position:relative}
  .photo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);z-index:2}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:center}
  .foot{position:absolute;left:64px;bottom:40px;z-index:2}
  .brand{font:800 19px/1 'DM Mono',monospace;letter-spacing:.05em;color:var(--forest);text-transform:uppercase}
  .url{font:400 17px/1.6 'DM Mono',monospace;color:var(--muted);display:block}
</style>
<div class="card">
  <div class="text">
    <div class="kicker">අධ්‍යාපනය · ප්‍රතිපත්ති සහ නීතිය</div>
    <h1>අන්තිමට A/L බිල<br><span class="u">ගෙවන්නෙ ළමයින්ද?</span></h1>
    <div class="dek">2020 සිට කැඩුණු විභාග දින දර්ශනය 2026 දී එකවර හදන්න ගිහින්, ඒකෙ පිරිවැය එක් සිසු පිරිසකට පැටවුවා.</div>
    <div class="foot"><span class="brand">The Analyst</span><span class="url">analyst.rizrazak.com</span></div>
  </div>
  <div class="photo"><img src="al-students.jpeg" alt="A/L candidates reading an exam paper"></div>
</div>
